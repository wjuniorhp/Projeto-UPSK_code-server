AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Cria um AWS CloudTrail para registrar atividades da conta,
  incluindo eventos relacionados ao Amazon EC2, armazenando os logs
  em um bucket S3 criptografado com uma chave SSE-KMS,  Rotação automática padrão do KMS, Bloqueio de acesso público, Validação de integridade dos logs e versionamento o S3.

Parameters:

  TrailName:
    Type: String
    Default: infra-cloudtrail
    Description: Nome do CloudTrail

  EnableLogFileValidation:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Habilita a validação de integridade dos arquivos do CloudTrail


Resources:

  # ============================================================
  # KMS Key
  # ============================================================

  CloudTrailKMSKey:
    Type: AWS::KMS::Key

    Properties:
      Description: >
        Chave KMS utilizada para criptografar os logs
        do CloudTrail no S3.

      # Rotação automática padrão do AWS KMS
      EnableKeyRotation: true

      KeyPolicy:
        Version: '2012-10-17'

        Statement:

          - Sid: EnableIAMUserPermissions
            Effect: Allow

            Principal:
              AWS:
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root

            Action:
              - kms:*

            Resource: '*'

          - Sid: AllowCloudTrailToEncryptLogs
            Effect: Allow

            Principal:
              Service:
                - cloudtrail.amazonaws.com

            Action:
              - kms:GenerateDataKey*
              - kms:DescribeKey

            Resource: '*'

            Condition:
              StringEquals:
                aws:SourceAccount:
                  - !Ref AWS::AccountId

              ArnLike:
                aws:SourceArn:
                  - !Sub arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/${TrailName}


  # ============================================================
  # KMS Alias
  # ============================================================

  CloudTrailKMSAlias:
    Type: AWS::KMS::Alias

    Properties:
      AliasName: !Sub alias/${TrailName}-logs

      TargetKeyId: !Ref CloudTrailKMSKey


  # ============================================================
  # S3 Bucket para os logs do CloudTrail
  # ============================================================

  CloudTrailBucket:
    Type: AWS::S3::Bucket

    Properties:

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt CloudTrailKMSKey.Arn

            BucketKeyEnabled: true

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub '${TrailName}-logs'

        - Key: Purpose
          Value: CloudTrailLogs

        - Key: Encryption
          Value: KMS


  # ============================================================
  # S3 Bucket Policy
  # ============================================================

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy

    DependsOn:
      - CloudTrailKMSKey

    Properties:

      Bucket: !Ref CloudTrailBucket

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          # ----------------------------------------------------
          # CloudTrail verifica o bucket
          # ----------------------------------------------------

          - Sid: AWSCloudTrailAclCheck

            Effect: Allow

            Principal:
              Service:
                - cloudtrail.amazonaws.com

            Action:
              - s3:GetBucketAcl

            Resource:
              - !GetAtt CloudTrailBucket.Arn

            Condition:
              StringEquals:
                aws:SourceAccount:
                  - !Ref AWS::AccountId


          # ----------------------------------------------------
          # CloudTrail grava os logs
          # ----------------------------------------------------

          - Sid: AWSCloudTrailWrite

            Effect: Allow

            Principal:
              Service:
                - cloudtrail.amazonaws.com

            Action:
              - s3:PutObject

            Resource:
              - !Sub '${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'

            Condition:

              StringEquals:

                aws:SourceAccount:
                  - !Ref AWS::AccountId

                s3:x-amz-acl:
                  - bucket-owner-full-control


          # ----------------------------------------------------
          # Bloqueia qualquer transporte não criptografado
          # ----------------------------------------------------

          - Sid: DenyInsecureTransport

            Effect: Deny

            Principal:
              AWS: '*'

            Action:
              - s3:*

            Resource:
              - !GetAtt CloudTrailBucket.Arn
              - !Sub '${CloudTrailBucket.Arn}/*'

            Condition:
              Bool:
                aws:SecureTransport:
                  - 'false'


  # ============================================================
  # CloudTrail
  # ============================================================

  CloudTrail:
    Type: AWS::CloudTrail::Trail

    DependsOn:
      - CloudTrailBucketPolicy
      - CloudTrailKMSKey

    Properties:

      TrailName: !Ref TrailName

      S3BucketName: !Ref CloudTrailBucket

      IsLogging: true

      IncludeGlobalServiceEvents: true

      IsMultiRegionTrail: true

      EnableLogFileValidation: !Ref EnableLogFileValidation

      # --------------------------------------------------------
      # KMS
      # --------------------------------------------------------

      KMSKeyId: !GetAtt CloudTrailKMSKey.Arn

      # --------------------------------------------------------
      # Management Events
      # --------------------------------------------------------

      EventSelectors:

        - IncludeManagementEvents: true

          ReadWriteType: All

      Tags:

        - Key: Name
          Value: !Ref TrailName

        - Key: Purpose
          Value: InfrastructureAudit


# ==============================================================
# Outputs
# ==============================================================

Outputs:

  CloudTrailName:
    Description: Nome do CloudTrail criado
    Value: !Ref CloudTrail


  CloudTrailBucket:
    Description: Bucket S3 onde os logs serão armazenados
    Value: !Ref CloudTrailBucket


  CloudTrailBucketArn:
    Description: ARN do bucket S3
    Value: !GetAtt CloudTrailBucket.Arn


  CloudTrailKMSKeyId:
    Description: ID da chave KMS usada pelo CloudTrail
    Value: !Ref CloudTrailKMSKey


  CloudTrailKMSKeyArn:
    Description: ARN da chave KMS
    Value: !GetAtt CloudTrailKMSKey.Arn


  CloudTrailKMSAlias:
    Description: Alias da chave KMS
    Value: !Sub alias/${TrailName}-logs


  MultiRegionTrail:
    Description: Indica que o Trail monitora todas as regiões
    Value: 'true'
